spring:
  application:
    name: ai-coach

  datasource:
    url: jdbc:postgresql://localhost:5432/ai_secretary
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      base-url: https://openrouter.ai/api
      chat:
        options:
          model: openai/gpt-4o
          max-tokens: 3000
          temperature: 0.7
      # embedding отключён — OpenRouter не поддерживает embeddings endpoint
      # включить когда будет прямой ключ OpenAI:
      # embedding:
      #   options:
      #     model: text-embedding-3-small

telegram:
  bot:
    token: ${TELEGRAM_BOT_TOKEN}
    username: ${TELEGRAM_BOT_USERNAME}
    owner-chat-id: ${TELEGRAM_OWNER_CHAT_ID:0}
    channel-id: ${TELEGRAM_CHANNEL_ID:-1003786886469}

coach:
  max-history-messages: 20
  weekly-report-days: 7
  checkin-morning-cron: "0 0 9 * * *"
  checkin-evening-cron: "0 0 21 * * *"

logging:
  level:
    ai.personal: DEBUG
    org.springframework.ai: INFO
    org.telegram: INFO