spring:
  application:
    name: ai-coach

  datasource:
    url: jdbc:postgresql://localhost:5432/ai_secretary
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  ai:
    # Chat — через OpenRouter (поддерживает gpt-4o, работает из РФ)
    openai:
      api-key: ${OPENAI_API_KEY}
      base-url: https://openrouter.ai/api
      chat:
        options:
          model: openai/gpt-4o
          max-tokens: 3000
          temperature: 0.7
      # Embedding через OpenRouter отключён — он не поддерживает /v1/embeddings
      # Используем отдельный бин в AiConfig.java с прямым OpenAI ключом

    vectorstore:
      pgvector:
        index-type: hnsw
        distance-type: cosine_distance
        dimensions: 1536          # text-embedding-3-small = 1536 dims
        initialize-schema: true

# Отдельный ключ для embeddings — прямой OpenAI (не OpenRouter)
# Получить на: https://platform.openai.com/api-keys
# Стоимость: ~$0.001/месяц для личного использования
openai:
  embedding:
    api-key: ${OPENAI_EMBEDDING_API_KEY}

telegram:
  bot:
    token: ${TELEGRAM_BOT_TOKEN}
    username: ${TELEGRAM_BOT_USERNAME}
    owner-chat-id: ${TELEGRAM_OWNER_CHAT_ID:0}
    channel-id: ${TELEGRAM_CHANNEL_ID:-1003786886469}

coach:
  owner-chat-id: ${COACH_OWNER_CHAT_ID:0}
  max-history-messages: 20
  weekly-report-days: 7
  checkin-morning-cron: "0 0 9 * * *"
  checkin-evening-cron: "0 0 21 * * *"

logging:
  level:
    ai.personal: DEBUG
    org.springframework.ai: INFO
    org.telegram: INFO

strava:
  client-id: ${STRAVA_CLIENT_ID:}
  client-secret: ${STRAVA_CLIENT_SECRET:}
  refresh-token: ${STRAVA_REFRESH_TOKEN:}

