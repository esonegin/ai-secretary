spring:
  application:
    name: ai-coach

  datasource:
    url: jdbc:postgresql://localhost:5432/ai_secretary
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          model: gpt-4o
          max-tokens: 3000
          temperature: 0.7
      embedding:
        options:
          model: text-embedding-3-small  # 1536 dimensions, дешёвый и быстрый

    vectorstore:
      pgvector:
        index-type: hnsw
        distance-type: cosine_distance
        dimensions: 1536
        initialize-schema: true

# Telegram Bot — токен получаешь у @BotFather
telegram:
  bot:
    token: ${TELEGRAM_BOT_TOKEN}
    username: ${TELEGRAM_BOT_USERNAME}
  owner-chat-id: ${TELEGRAM_OWNER_CHAT_ID:0}

coach:
  max-history-messages: 20
  weekly-report-days: 7
  checkin-morning-cron: "0 0 9 * * *"
  checkin-evening-cron: "0 0 21 * * *"

logging:
  level:
    ai.personal: DEBUG
    org.springframework.ai: INFO
    org.telegram: INFO

  # Твой личный chatId в Telegram (узнать: написать боту /start, посмотреть в логах)
  # или использовать @userinfobot в Telegram
  # Без этого check-in не будут отправляться
  # owner-chat-id уже вложен внутрь telegram.bot: